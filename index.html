<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d0e">
  <title>Luchkov Detailing</title>
  <meta name="description" content="Официальный логотип Luchkov Detailing">
  <style>
    :root{--bg:#0b0d0e;--panel:#15191c;--lime:#c8ff00;--text:#f5f7f8;--muted:#9aa2a8}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#22282c 0,#0b0d0e 54%)}
    main{width:min(960px,100%);text-align:center}
    .eyebrow{margin:0 0 14px;color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.28em;text-transform:uppercase}
    h1{margin:0 0 28px;font-size:clamp(32px,7vw,76px);line-height:.95;letter-spacing:-.04em;text-transform:uppercase}
    .logo-frame{padding:clamp(12px,2vw,22px);border:1px solid rgba(200,255,0,.45);border-radius:22px;background:var(--panel);box-shadow:0 0 0 1px rgba(255,255,255,.04),0 24px 80px rgba(0,0,0,.45),0 0 48px rgba(200,255,0,.08)}
    .logo-frame img{display:block;width:100%;height:auto;border-radius:14px;background:#fff}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;background:var(--lime);color:#090b0c;font-weight:800;text-decoration:none;letter-spacing:.02em}
    footer{margin-top:20px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Automotive detailing</p>
    <h1>Luchkov Detailing</h1>
    <section class="logo-frame" aria-label="Логотип Luchkov Detailing">
      <img src="https://d8j0ntlcm91z4.cloudfront.net/user_2vlL7I6MiK06mgfYxe5AZClc0Ov/hf_20260717_144347_ca5d025c-9cf2-429f-89de-fb2d86d77ce9.png" alt="Лаймовый логотип Luchkov Detailing с автомобилем BMW">
    </section>
    <div class="actions">
      <a href="https://d8j0ntlcm91z4.cloudfront.net/user_2vlL7I6MiK06mgfYxe5AZClc0Ov/hf_20260717_144347_ca5d025c-9cf2-429f-89de-fb2d86d77ce9.png" download>Скачать логотип</a>
    </div>
    <footer>© Luchkov Detailing</footer>
  </main>
</body>
</html>
